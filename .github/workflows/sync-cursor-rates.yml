name: Sync Cursor rates

on:
  schedule:
    # Weekly on Monday 15:00 UTC (aligns with Dependabot weekly cadence).
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync Cursor rates from docs
        id: sync
        run: |
          set -euo pipefail
          summary="$(go run ./cmd/ratesync -write)"
          echo "$summary"
          {
            echo "summary<<EOF"
            echo "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if git diff --quiet -- cost/rates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update PR when rates.json changed
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          set -euo pipefail
          branch="chore/cursor-rates-sync"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add cost/rates.json
          git commit -m "$(cat <<'EOF'
          chore(cost): sync Cursor model rates

          Automated update from Cursor teams pricing docs.
          EOF
          )"
          git push -u origin "$branch" --force-with-lease

          open_count="$(gh pr list --state open --head "$branch" --json number --jq 'length')"
          if [ "$open_count" != "0" ]; then
            echo "Updated existing open sync PR for $branch."
            exit 0
          fi

          gh pr create \
            --title "chore(cost): sync Cursor model rates" \
            --body "$(cat <<EOF
          ## Summary

          Automated Cursor rate catalog sync from [teams pricing](https://cursor.com/docs/account/teams/pricing).

          \`\`\`
          ${SUMMARY}
          \`\`\`

          ## Notes

          - Updates only \`providers.cursor\` (and \`asOf\`); Anthropic is untouched
          - Stale models are kept until a human removes them
          - Do **not** auto-merge — review the rate diff before merging

          EOF
          )"
