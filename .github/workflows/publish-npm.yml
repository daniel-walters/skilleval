# Publish the TypeScript SDK to npm when a v* tag is pushed
# (same tags as the GoReleaser GitHub Release workflow).
#
# Requires repository secret NPM_TOKEN (npm Automation or granular access token
# with publish rights for the `skilleval` package).
#
# First publish of an already-cut tag: Actions → Publish npm → Run workflow
# with the version (e.g. 0.1.0), after NPM_TOKEN is set.

name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "npm package version to publish (no leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Resolve version
        id: ver
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install and test
        run: |
          npm ci
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm test

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
