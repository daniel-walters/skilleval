# Publish the TypeScript SDK (+ platform CLI binaries) to npm when a v* tag
# is pushed (same tags as the GoReleaser GitHub Release workflow).
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN required for publish.
# Configure a Trusted Publisher on each package (main + platforms):
#   Organization or user: daniel-walters
#   Repository:           skilleval
#   Workflow filename:    publish-npm.yml
#   Allowed actions:      npm publish
#
# Packages:
#   @danielwaltersdev/skilleval
#   @danielwaltersdev/skilleval-{darwin,linux,win32}-{arm64,x64}
#
# Requires npm CLI ≥ 11.5.1 (Node 24+). GitHub-hosted runners only.
#
# First-ever publish of a new package name: publish once with `npm login`
# locally, then add the trusted publisher. Later tags publish via this workflow.
#
# Backfill an already-cut tag: Actions → Publish npm → Run workflow with
# version (e.g. 0.1.1). Always checks out refs/tags/v<version>.

name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "npm package version to publish (no leading v); must match an existing v* tag"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Resolve version
        id: ver
        # Job default is sdk/typescript; that path does not exist until checkout.
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm ≥ 11.5.1 required for OIDC trusted publishing.
          node-version: "24"
          # Do not set registry-url: setup-node would write an empty
          # //registry.npmjs.org/:_authToken line that makes npm skip OIDC
          # and fail with ENEEDAUTH (actions/setup-node#1551).
          package-manager-cache: false

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build platform binaries
        working-directory: sdk/typescript
        run: node scripts/build-platform-binaries.mjs "${{ steps.ver.outputs.version }}"

      - name: Sync versions
        run: node scripts/sync-platform-versions.mjs "${{ steps.ver.outputs.version }}"

      - name: Publish platforms then main
        # OIDC — do not set NODE_AUTH_TOKEN; npm uses trusted publishing.
        # Platforms first so the main package's optionalDependencies resolve.
        run: node scripts/publish-platforms-then-main.mjs
